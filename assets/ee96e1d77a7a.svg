<svg xmlns="http://www.w3.org/2000/svg" width="25" height="20" viewBox="0 0 25 20" role="img" aria-label="$">
<style>
text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13.6px; white-space: pre; }
