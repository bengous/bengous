<svg xmlns="http://www.w3.org/2000/svg" width="588" height="237" viewBox="0 0 588 237" role="img" aria-label="$ bengous --about: Full-stack engineer. France. I work with coding agents and build the context, tooling and guardrails that keep control of the result. $ bengous --lately: Gateways and CLIs around the agent loop: hooks, context routing, completion alerts. Rust case studies and open data web apps on the side. $ bengous --stack: TypeScript, Rust, Go, Python -- whatever fits the problem. Java and Kotlin on regulated-industry backends.">
