<svg xmlns="http://www.w3.org/2000/svg" width="25" height="20" viewBox="0 0 25 20" role="img" aria-label="$">
<style>
text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13.6px; }
.r { animation: show 1ms 4.75s both; }
.c { animation: blink 1.06s steps(1, end) 4.75s infinite; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes show { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g class="r"><text y="14.6" fill="#1f2328"><tspan x="0" font-weight="600">$</tspan></text>
<rect class="c" x="16.32" y="3.992" width="8.16" height="13.6" fill="#1f2328"/></g>
</svg>
